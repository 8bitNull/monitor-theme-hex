let chartData=null,selectedSample=24;
function chart(value=28,kind='CPU'){
 const isPing=kind==='延迟',unit=isPing?'ms':'%',compare=isPing&&state.compare;
 // Deterministic snapshots: irregular variation, a short peak, and a missing sample.
 const variation=[-.8,-.5,.1,-.2,.4,1.1,.7,.2,-.4,-.2,.1,.3,2.6,1.4,.5,.2,-.2,-.4,-.1,.5,.3,.2,-.2,.1,0];
 const offset=state.range==='1h'?3:state.range==='24h'?8:0;
 const samples=variation.map((_,i)=>i===8&&state.range==='24h'?null:Math.max(0,Math.min(isPing?999:100,value+variation[(i+offset)%variation.length]*(isPing?3:4))));samples[24]=value;
 const secondary=samples.map((v,i)=>v===null?null:v+7+variation[(i+4)%variation.length]*2);
 const max=isPing?Math.ceil(Math.max(...samples.filter(v=>v!==null),...(compare?secondary.filter(v=>v!==null):[]))/10)*10:100;
 const x=i=>39+i*10.25,y=v=>162-v/max*130;
 const path=values=>{let connected=false;return values.map((v,i)=>{if(v===null){connected=false;return ''}const command=connected?'L':'M';connected=true;return `${command}${x(i)},${y(v)}`}).join(' ')};
 const segments=[];let segment=[];samples.forEach((v,i)=>{if(v===null){if(segment.length)segments.push(segment);segment=[]}else segment.push([x(i),y(v)])});if(segment.length)segments.push(segment);
 const area=segments.map(points=>`M${points[0][0]},162 `+points.map(p=>'L'+p.join(',')).join(' ')+` L${points.at(-1)[0]},162Z`).join(' ');
 const end=new Date('2026-09-26T09:41:00+08:00').getTime(),start=end-parseInt(state.range)*3600000;
 const date=i=>new Date(start+(end-start)*i/24).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
 chartData={samples,secondary,compare,kind,unit,x,y,date};
 return `<div class="chartbox"><div class="chartcaption"><span>${kind} · ${unit}</span><span>峰值 ${Math.max(...samples.filter(v=>v!==null)).toFixed(1)} ${unit}</span></div><button class="chartbutton" data-action="sample" aria-label="查看图表采样详情，左右方向键选择样本"><svg class="chart" viewBox="0 0 310 211" role="img" aria-label="${kind} ${state.range} 模拟趋势图"><path class="grid" d="M39 32H285M39 97H285M39 162H285"/><text x="29" y="36" text-anchor="end">${max}</text><text x="29" y="101" text-anchor="end">${max/2}</text><text x="29" y="166" text-anchor="end">0</text><path class="area" d="${area}"/><path class="line" d="${path(samples)}"/>${compare?`<path fill="none" stroke="var(--green)" stroke-width="2" stroke-dasharray="4 4" d="${path(secondary)}"/>`:''}<g id="chart-selection"></g><text x="39" y="187">${date(0).split(' ')[1]}</text><text x="162" y="187" text-anchor="middle">${date(12).split(' ')[1]}</text><text x="285" y="187" text-anchor="end">09:41</text>${state.range==='24h'?'<text x="39" y="205">09/25</text><text x="285" y="205" text-anchor="end">09/26</text>':''}</svg></button><div id="sample-detail" aria-live="polite"></div><div class="chartcaption"><span>轻触曲线查看采样</span>${state.range==='24h'?'<span>断点表示采样缺失</span>':''}</div></div>`;
}
function selectSample(index){
 if(!chartData)return;selectedSample=Math.max(0,Math.min(24,index));state.sample=true;
 const {samples,secondary,compare,kind,unit,x,y,date}=chartData,v=samples[selectedSample],other=secondary[selectedSample];
 $('#chart-selection').innerHTML=`<path class="chart-guide" d="M${x(selectedSample)} 25V162"/>${v===null?'':`<circle class="chart-point" cx="${x(selectedSample)}" cy="${y(v)}" r="4"/>`}${compare&&other!==null?`<circle class="chart-point" style="stroke:var(--green)" cx="${x(selectedSample)}" cy="${y(other)}" r="4"/>`:''}`;
 $('#sample-detail').innerHTML=`<div class="sample"><div class="sample-header"><span>${date(selectedSample)} · 模拟采样</span><button class="iconbtn" data-action="dismiss-sample" aria-label="关闭采样详情">${icon('close')}</button></div><div class="sample-values"><span>${kind} <b>${v===null?'样本缺失':v.toFixed(1)+' '+unit}</b></span>${compare?`<span>备用探测 <b>${other===null?'样本缺失':other.toFixed(1)+' '+unit}</b></span>`:''}</div></div>`;
}
function detailPage(){const n=nodes.find(n=>n.id===state.node);const tabs=[['overview','总览'],['resources','资源'],['network','网络'],['info','资料']];let body='';if(!n.online&&state.tab!=='info'){body=`<div class="card"><span class="badge red">节点离线</span><h2 style="margin-top:20px">尚未收到新的上报</h2><p class="muted" style="font-size:13px;line-height:1.8">最后上报于 12 分钟前。实时指标不可用，历史数据在本 Demo 中未提供。</p><button class="secondary" data-tab="info">查看设备资料</button></div>`}else if(state.tab==='overview'){body=`<div class="summaryline">${badge(n)}<span>模拟快照 · 09:41:00</span></div><div class="card"><h2>资源使用</h2><div class="bigmetrics">${[['CPU',n.cpu,'4 核'],['内存',n.mem,`${(n.mem*.08).toFixed(2)} / 8.00 GB`],['硬盘',n.disk,`${(n.disk*.8).toFixed(1)} / 80.0 GB`],['负载',.28,'1 分钟平均']].map(([label,value,sub])=>`<div class="bigmetric"><small>${label}</small><strong>${Number(value).toFixed(label==='负载'?2:1)}<em>${label==='负载'?'':' %'}</em></strong>${label!=='负载'?`<div class="track"><i style="width:${value}%"></i></div>`:''}${state.totals?`<p>${sub}</p>`:''}</div>`).join('')}</div></div><div class="card"><div class="sectionline" style="margin:0 0 17px"><h2>实时网速</h2><span>模拟快照</span></div><div class="bigmetrics"><div class="bigmetric"><small>↑ 上行</small><strong>${num(n.up)} <em>Mbps</em></strong></div><div class="bigmetric"><small>↓ 下行</small><strong>${num(n.down)} <em>Mbps</em></strong></div></div><button class="listrow" data-tab="network"><span>主要线路延迟</span><span class="rowvalue" style="color:var(--blue)">${n.ping} ms ${icon('chevron')}</span></button></div><div class="card"><h2>流量与账单</h2><div class="metriclabel"><span>本月用量</span><b>${n.used} GB / 1 TB</b></div><div class="track" style="margin:12px 0"><i style="width:${n.used/10}%"></i></div><div class="listrow"><span>费用</span><span class="rowvalue">$5.00 / 月付</span></div><div class="listrow"><span>到期时间</span><span class="rowvalue">未设置</span></div></div>`}else if(state.tab==='resources'){const val=state.metric==='CPU'?n.cpu:state.metric==='内存'?n.mem:n.disk;body=`<div class="card"><div class="charttools"><div class="segment">${['CPU','内存','硬盘'].map(m=>`<button data-metric="${m}" aria-pressed="${state.metric===m}">${m}</button>`).join('')}</div></div><div class="bigmetric"><small>当前${state.metric}</small><strong>${val.toFixed(1)} <em>%</em></strong></div>${rangeControls()}${chart(val,state.metric)}</div><div class="card"><h2>采样说明</h2><p class="muted" style="font-size:12px;line-height:1.9;margin:0">按时间范围展示资源变化。切换指标或范围可预览不同趋势；点击图表查看样本。</p></div>`}else if(state.tab==='network'){const ping=n.ping+(state.route==='China Telecom'?13:state.route==='China Unicom'?7:0);body=`<div class="card"><h2>网络质量</h2><button class="routebutton" data-action="routes"><span>${state.route==='Tokyo gateway'?(n.id===1?'Tokyo gateway':'默认探测线路'):state.route}</span>${icon('down')}</button><div class="detailstats"><div><small>当前延迟</small><strong>${ping} <small>ms</small></strong></div><div><small>P95 延迟</small><strong>${(ping+6.9).toFixed(1)} <small>ms</small></strong></div><div><small>丢包率</small><strong>0.0 <small>%</small></strong></div></div>${rangeControls()}${chart(ping,'延迟')}<button class="listrow" data-action="compare"><span>${state.compare?'关闭线路比较':'比较另一条线路'}</span><span class="rowvalue">${state.compare?'已开启':icon('chevron')}</span></button>${state.compare?`<div class="chartcaption"><span>实线：${state.route==='Tokyo gateway'?(n.id===1?'Tokyo gateway':'默认探测线路'):state.route}</span><span style="color:var(--green)">虚线：备用探测</span></div>`:''}</div><div class="card"><h2>丢包记录</h2><span class="badge">当前范围未发现丢包</span><p class="muted" style="font-size:11px;margin-bottom:0">模拟数据 · 所选范围 ${state.range}</p></div>`}else{body=`<div class="card settingsgroup">${[['节点名称',n.name],['所在地区',n.city],['操作系统',n.os],['处理器','AMD EPYC · 4 核'],['内存','8 GB'],['硬盘','80 GB SSD'],['运行时间',n.uptime],['节点分组',n.group]].map(([k,v])=>`<div class="listrow"><span>${k}</span><span class="rowvalue" style="max-width:65%;text-align:right">${v}</span></div>`).join('')}</div><div class="card"><h2>备注</h2><p class="muted" style="font-size:12px;line-height:1.8;margin:0">${n.group==='生产环境'?'用于日常服务与网络质量监控。':'用于容灾与备用连接。'}<br>本页所有设备信息均为演示内容。</p></div>`}return `<div class="detailtabs" aria-label="详情分区">${tabs.map(([key,label])=>`<button data-tab="${key}" aria-pressed="${state.tab===key}">${label}</button>`).join('')}</div>${body}<div class="footnote">演示数据 · 不代表实际服务器状态</div>`}
function rangeControls(){return `<div class="charttools"><div class="segment">${['1h','6h','24h'].map(r=>`<button data-range="${r}" aria-pressed="${state.range===r}">${r}</button>`).join('')}</div><button class="iconbtn" data-action="refresh" aria-label="刷新演示图表">${icon('refresh')}</button></div>`}
function render(resetScroll=true){$('#app').classList.toggle('dark',state.dark);const detail=state.node!==null;head.classList.toggle('detailhead',detail);if(detail){const n=nodes.find(n=>n.id===state.node);head.innerHTML=`<button class="iconbtn" data-action="back" aria-label="返回节点列表">${icon('arrow')}</button><div class="identity"><h1>${n.name}</h1><small>${n.city} · ${n.os}</small></div><button class="iconbtn" data-action="node-picker" aria-label="切换节点">${icon('down')}</button>`;content.innerHTML=detailPage();nav.hidden=true;nav.style.display='none'}else{head.innerHTML=`<div><div class="brandline"><span class="logomark">H</span><h1>${state.page==='nodes'?'节点':state.page==='overview'?'概览':'设置'}</h1></div></div><span class="live">${state.page==='settings'?'HEX':state.page==='overview'?'09:41 快照':'09:41 更新'}</span>`;content.innerHTML=state.page==='nodes'?listPage():state.page==='overview'?overviewPage():settingsPage();nav.hidden=false;nav.style.display='grid';nav.innerHTML=[['nodes','grid','节点'],['overview','chart','概览'],['settings','settings','设置']].map(([p,i,label])=>`<button data-page="${p}" ${state.page===p?'aria-current="page"':''}><span class="navicon">${icon(i)}</span>${label}</button>`).join('');if(state.page==='nodes'){$('#search').value=state.query;drawList()}}if(resetScroll){content.scrollTop=0;content.classList.remove('page-enter');void content.offsetWidth;content.classList.add('page-enter')}if(state.sample&&$('#sample-detail'))selectSample(selectedSample);}
function positionSheet(){const app=$('#app'),r=app.getBoundingClientRect(),border=app.clientLeft;sheet.style.left=`${r.left+r.width/2}px`;sheet.style.width=`${app.clientWidth}px`;sheet.style.bottom=`${Math.max(0,innerHeight-r.bottom+border)}px`;sheet.style.maxHeight=`${app.clientHeight*.88}px`}
function openSheet(title,body){if(!sheet.open)lastFocus=document.activeElement;sheet.innerHTML=`<div class="sheet-inner"><div class="handle"></div><div class="sheethead"><h2 id="sheet-title">${title}</h2><button class="iconbtn" data-action="close" aria-label="关闭面板">${icon('close')}</button></div>${body}</div>`;positionSheet();if(!sheet.open)sheet.showModal()}
function closeSheet(){sheet.close();if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true})}
function filters(){draft={region:state.region,status:state.status,group:state.group,sort:state.sort};filterBody()}
function filterBody(){openSheet('筛选节点',[['status','状态',['全部','在线','离线','高负载']],['region','地区',['全部','日本','新加坡','中国','德国','美国']],['group','分组',['全部','生产环境','备用节点']],['sort','排序',['默认顺序','延迟优先','负载优先']]].map(([k,title,opts])=>`<h3>${title}</h3><div class="chips">${opts.map(o=>`<button data-filter="${k}" data-value="${o}" aria-pressed="${draft[k]===o}">${o}</button>`).join('')}</div>`).join('')+'<div class="sheetactions"><button class="secondary" data-action="filter-reset">重置</button><button class="primary" data-action="filter-apply">显示结果</button></div>')}
function showRoutes(){openSheet('选择探测线路',['Tokyo gateway','China Telecom','China Unicom'].map((r,i)=>`<button class="listrow" data-route="${r}" aria-pressed="${state.route===r}"><span>${r}<small>${['默认线路','电信探测','联通探测'][i]}</small></span>${state.route===r?icon('check'):icon('chevron')}</button>`).join(''))}
function openNode(id){const switching=state.node!==null;state.homeScroll=switching?state.homeScroll:content.scrollTop;state.node=Number(id);if(!switching)state.tab='overview';state.sample=false;history[switching?'replaceState':'pushState']({node:state.node},'',`#node-${id}`);render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){if(state.page==='nodes')state.homeScroll=content.scrollTop;state.page=d.page;state.node=null;render();if(d.page==='nodes')content.scrollTop=state.homeScroll;return}if(d.node){if(sheet.open)closeSheet();openNode(d.node);return}if(d.tab){state.tab=d.tab;state.sample=false;render();return}if(d.region){state.region=d.region;state.page='nodes';render();return}if(d.metric){state.metric=d.metric;state.sample=false;render(false);return}if(d.range){state.range=d.range;state.sample=false;render(false);return}if(d.filter){draft[d.filter]=d.value;for(const button of sheet.querySelectorAll(`[data-filter="${d.filter}"]`))button.setAttribute('aria-pressed',String(button.dataset.value===d.value));return}if(d.route){state.route=d.route;closeSheet();render(false);return}switch(d.action){case'filters':filters();break;case'close':closeSheet();break;case'filter-reset':draft={region:'全部',status:'全部',group:'全部',sort:'默认顺序'};filterBody();break;case'filter-apply':Object.assign(state,draft);closeSheet();render();break;case'clear':Object.assign(state,{query:'',region:'全部',status:'全部',group:'全部',sort:'默认顺序'});render();break;case'back':history.back();break;case'node-picker':openSheet('切换节点',nodes.map(n=>`<button class="listrow" data-node="${n.id}"><span class="rowname">${n.flag} ${n.name.split(' · ')[0]}</span>${badge(n)}</button>`).join(''));break;case'routes':case'global-route':showRoutes();break;case'compare':state.compare=!state.compare;state.sample=false;render(false);break;case'sample':{const rect=b.getBoundingClientRect();const position=e.detail===0?24:Math.round(((e.clientX-rect.left)/rect.width*310-39)/10.25);selectSample(position);break}case'dismiss-sample':state.sample=false;$('#chart-selection').innerHTML='';$('#sample-detail').innerHTML='';break;case'refresh':announce('演示快照已刷新 · 未连接实际服务器');break;case'records':state.page='overview';render();content.scrollTop=content.scrollHeight;break;case'about':openSheet('关于 HEX','<div class="copyright">HEX · 手机 App 布局 Demo<br>节点 / 概览 / 设置 / 节点详情<br><br>所有指标均为模拟数据。<br>用于评审移动端布局与操作流程。</div>');break;case'reset':Object.assign(state,{region:'全部',status:'全部',group:'全部',sort:'默认顺序',query:'',range:'6h',route:'Tokyo gateway',detailed:false,totals:true,dark:false,compare:false});render();announce('已恢复演示默认设置');break}});
document.addEventListener('keydown',e=>{if(!e.target.closest('.chartbutton'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();selectSample((state.sample?selectedSample:24)+(e.key==='ArrowLeft'?-1:1))}if(e.key==='Escape'){state.sample=false;$('#chart-selection').innerHTML='';$('#sample-detail').innerHTML=''}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;drawList()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='dark'){state.dark=t.checked;$('#app').classList.toggle('dark',state.dark)}if(t.id==='density')state.detailed=t.value==='detailed';if(t.id==='totals')state.totals=t.checked;if(t.id==='default-range')state.range=t.value;});
sheet.addEventListener('click',e=>{if(e.target===sheet){const r=sheet.getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)closeSheet()}});
window.addEventListener('resize',()=>{if(sheet.open)positionSheet()});
window.addEventListener('popstate',()=>{const id=Number(location.hash.replace('#node-',''));state.node=nodes.some(n=>n.id===id)?id:null;render();if(state.node===null)content.scrollTop=state.homeScroll});
if(location.hash.startsWith('#node-')){const id=Number(location.hash.slice(6));if(nodes.some(n=>n.id===id))state.node=id}render();
</script><script src="mobile-app-demo-refinement.js"></script><script src="mobile-app-demo-scenarios.js"></script></body></html>
