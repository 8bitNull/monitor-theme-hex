name: 改进建议
description: 提出使用需求或体验改进
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 哪个操作遇到困难，影响了什么任务？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 描述改进后的使用方式，可附脱敏示意图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前做法或替代方案
  - type: input
    id: context
    attributes:
      label: 版本与设备
      description: 如有帮助，补充主题版本、桌面或手机、浏览器。
